<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chord Companion</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <div id="app-root">

    <!-- HEADER -->
    <header class="glass-panel"
      style="margin: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 10;">
      <div class="flex-col">
        <h1 id="track-title"
          style="margin: 0; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px;">
          No Song Detected</h1>
        <div class="flex-center" style="gap: 8px;">
          <span id="track-artist" style="font-size: 0.8rem; color: var(--text-muted);">Waiting for YouTube...</span>
          <span id="track-capo"
            style="font-size: 0.7rem; background: var(--glass-border); padding: 1px 4px; border-radius: 4px; display: none;">Capo:
            ?</span>
        </div>
      </div>
      <div class="flex-center" style="gap: 8px;">
        <button id="nav-player" class="btn btn-icon" title="Player">🎵</button>
        <button id="nav-builder" class="btn btn-icon" title="Builder">🛠️</button>
      </div>
    </header>

    <!-- VIEWS CONTAINER -->
    <main id="views-container" style="position: relative; flex: 1; overflow: hidden;">

      <!-- VIEW: PLAYER -->
      <div id="view-player" class="view active">
        <div id="lyrics-container" class="scroll-container">
          <!-- Lyrics Rendered Here -->
          <div class="placeholder flex-center flex-col" style="height: 100%; opacity: 0.5;">
            <p>Play a song on YouTube</p>
          </div>
        </div>

        <!-- Snap to Sync FAB -->
        <button id="btn-snap-sync" class="btn btn-primary fab-snap" title="Snap to Current Time">
          🎯 Snap
        </button>

        <!-- Floating Controls -->
        <div class="player-controls glass-panel">
          <button id="btn-speed-down" class="btn btn-icon" title="Slower">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M19 13H5v-2h14v2z" />
            </svg>
          </button>
          <span id="display-speed" style="font-family: var(--font-mono); font-size: 0.9rem;">1.0x</span>
          <button id="btn-speed-up" class="btn btn-icon" title="Faster">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" />
            </svg>
          </button>
          <div style="width: 1px; height: 20px; background: var(--glass-border); margin: 0 10px;"></div>
          <button id="btn-play-pause" class="btn btn-primary"
            style="border-radius: 50%; width: 40px; height: 40px; padding: 0;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
          </button>
          <div style="width: 1px; height: 20px; background: var(--glass-border); margin: 0 10px;"></div>
          <button id="btn-sync-toggle" class="btn btn-icon" title="Toggle Sync Mode">⚡</button>
        </div>
      </div>

      <!-- VIEW: BUILDER -->
      <div id="view-builder" class="view">
        <div class="flex-col" style="height: 100%; padding: 10px; gap: 10px;">
          <div class="flex-center" style="gap: 10px;">
            <input id="input-artist" class="glass-input" placeholder="Artist">
            <input id="input-title" class="glass-input" placeholder="Title">
          </div>
          <div class="flex-center" style="gap: 10px;">
            <button id="btn-import" class="btn btn-secondary" style="flex: 1; font-size: 0.8rem;">📥 Import Tab</button>
            <button id="btn-magic-sync" class="btn btn-primary" style="flex: 1; font-size: 0.8rem;">✨ Magic
              Sync</button>
          </div>
          <textarea id="input-content" class="glass-input"
            style="flex: 1; resize: none; font-family: var(--font-mono); font-size: 0.9rem;"
            placeholder="Paste chords here..."></textarea>

          <button id="btn-open-studio" class="btn btn-primary" style="width: 100%;">🎤 Open Sync Studio</button>

          <div class="flex-center" style="gap: 10px;">
            <button id="btn-save-browser" class="btn btn-secondary" style="flex: 1;">Save Local</button>
            <button id="btn-save-disk" class="btn btn-secondary" style="flex: 1;">Download JSON</button>
          </div>
        </div>
      </div>

      <!-- VIEW: SYNC STUDIO -->
      <div id="view-studio" class="view">
        <div class="flex-col" style="height: 100%;">
          <div class="glass-panel" style="margin: 10px; padding: 10px; text-align: center;">
            <h3 style="margin: 0; color: var(--primary);">Sync Studio</h3>
            <small style="color: var(--text-muted);">Tap SPACE to sync</small>
          </div>

          <div id="studio-stage" class="scroll-container" style="flex: 1; text-align: center; padding: 20px;">
            <!-- Tokens -->
          </div>

          <div class="glass-panel" style="margin: 10px; padding: 10px; display: flex; gap: 10px;">
            <button id="btn-studio-cancel" class="btn btn-secondary" style="flex: 1;">Cancel</button>
            <button id="btn-studio-start" class="btn btn-primary" style="flex: 2;">▶ Start Tapping</button>
            <button id="btn-studio-save" class="btn btn-success" style="flex: 1; display: none;">Save</button>
          </div>
        </div>
      </div>

    </main>

    <!-- TOAST CONTAINER -->
    <div id="toast-container"
      style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 10px; pointer-events: none;">
    </div>

  </div>
  <script type="module" src="app.js"></script>
</body>

</html>
